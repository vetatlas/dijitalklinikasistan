<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - Dijital Klinik Asistan</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-loader">
        <div class="vip-spinner">
            <div class="ring outer-ring"></div>
            <div class="ring inner-ring"></div>
            <div class="dot"></div>
        </div>
    </div>
    <div class="login-wrapper">
        <div class="login-card">
            
            <h1 class="login-title">Dijital Klinik Asistan</h1>
            <p class="login-subtitle">Sisteme erişmek için lütfen giriş yapın.</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-posta Adresi</label>
                    <input type="email" id="email" class="form-input" placeholder="ornek@klinik.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="primary-btn" id="loginBtn">Giriş Yap</button>
                
                <div id="errorMessage" class="error-msg">Giriş başarısız. Lütfen bilgilerinizi kontrol edin.</div>
            </form>

        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script>
        // Sayfa yüklendiğinde çalışacak kusursuz geçiş efekti
        window.addEventListener("load", () => {
            const loader = document.querySelector(".page-loader");
            loader.classList.add("loader-hidden");
            // Animasyon bitince DOM'dan temizleyelim ki arkada tıklamaları engellemesin
            loader.addEventListener("transitionend", () => {
                loader.remove();
            });
        });
    </script>
</body>
</html>
