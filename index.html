<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>VetPremium • Klinik Asistan</title>
    
    <!-- Premium Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Quill Editor CSS (EKSİK OLAN BU!) -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    
    <!-- Kendi CSS'imiz -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- Ana Uygulama Konteyneri -->
    <div id="app">
        
        <!-- Üst Bar (Dinamik başlık ve profil) -->
        <header class="app-header">
            <div class="header-left">
                <h1 id="page-title">Ana Sayfa</h1>
            </div>
            <div class="header-right">
                <button class="icon-btn" id="profile-btn">
                    <i class="fas fa-user-circle"></i>
                </button>
            </div>
        </header>

        <!-- Ana İçerik Alanı (Sayfalar burada değişecek) -->
        <main id="view-container" class="view-container">
            <!-- Sayfalar dinamik olarak JavaScript ile yüklenecek -->
            <div id="view-home" class="view active-view">
                <!-- Home içeriği js ile render edilecek -->
            </div>
            <div id="view-courses" class="view">
                <!-- Dersler Hiyerarşisi -->
            </div>
            <div id="view-arena" class="view">
                <!-- Soru Bankası -->
            </div>
            <div id="view-clinic" class="view">
                <!-- Klinik Araçlar -->
            </div>
            <div id="view-panel" class="view">
                <!-- Yönetim Paneli içeriği JavaScript ile doldurulacak -->
            </div>
        </main>

        <!-- Alt Navigasyon Bar (Premium) -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-view="home">
                <i class="fas fa-home"></i>
                <span>Ana Sayfa</span>
            </div>
            <div class="nav-item" data-view="courses">
                <i class="fas fa-book-open"></i>
                <span>Dersler</span>
            </div>
            <div class="nav-item" data-view="arena">
                <i class="fas fa-brain"></i>
                <span>Arena</span>
            </div>
            <div class="nav-item" data-view="clinic">
                <i class="fas fa-syringe"></i>
                <span>Klinik</span>
            </div>
            <!-- YENİ PANEL BUTONU -->
            <div class="nav-item" data-view="panel">
                <i class="fas fa-cog"></i>
                <span>Panel</span>
            </div>
        </nav>
    </div>

    <!-- Premium Modal Konteyneri (Dinamik) -->
    <div id="modal-container" class="modal-container"></div>

    
    
    <!-- Quill Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Bizim Scriptler -->
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <script src="js/courses.js"></script>
    <script src="js/arena.js"></script>
    <script src="js/clinic.js"></script>
    <script src="js/panel.js"></script>
    </body>
</html>
