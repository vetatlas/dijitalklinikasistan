<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş İçerik Editörü - VIP Panel</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        /* VIP Koyu Tema Editör Özelleştirmeleri */
        .editor-container { max-width: 1000px; margin: 0 auto; background: rgba(19, 26, 42, 0.9); border-radius: 20px; padding: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        .ql-toolbar.ql-snow { border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); border-radius: 12px 12px 0 0; padding: 15px; }
        .ql-container.ql-snow { border-color: rgba(255,255,255,0.1); border-radius: 0 0 12px 12px; height: 500px; font-size: 1.1rem; color: #E2E8F0; font-family: 'Montserrat', sans-serif; }
        .ql-snow .ql-stroke { stroke: #CBD5E1; }
        .ql-snow .ql-fill { fill: #CBD5E1; }
        .ql-snow .ql-picker { color: #CBD5E1; }
        .ql-editor p { margin-bottom: 15px; line-height: 1.8; }
        .ql-editor img { border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin: 20px 0; max-width: 100%; }
        .header-selects { display: flex; gap: 20px; margin-bottom: 20px; }
        .header-selects select { flex: 1; }
    </style>
</head>
<body>
    <div id="vipToast" class="vip-toast"><span id="toastMsg"></span></div>

    <header class="top-bar">
        <h2 style="color: #D4AF37; letter-spacing: 2px;">GELİŞMİŞ İÇERİK EDİTÖRÜ</h2>
    </header>

    <main class="container">
        <a href="kutuphane-yonetimi.html" class="back-button">← Yönetim Paneline Dön</a>

        <div class="editor-container">
            <div class="header-selects">
                <select id="dersSecimi" class="form-input" style="background-color: #0B1120;">
                    <option value="">Önce ders seçin...</option>
                </select>
                <select id="konuSecimi" class="form-input" style="background-color: #0B1120;">
                    <option value="">Sonra konu seçin...</option>
                </select>
            </div>

            <div id="editor"></div>

            <button id="btnKaydet" class="primary-btn" style="margin-top: 30px; background: linear-gradient(135deg, #D4AF37, #B8860B);">İçeriği Veritabanına Kaydet</button>
        </div>
    </main>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script type="module" src="js/editor-app.js"></script>
</body>
</html>
