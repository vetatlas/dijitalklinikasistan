<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Okuma - VIP Asistan</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Sadece bu sayfaya özel okuma odaklı VIP stiller */
        .reading-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(19, 26, 42, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }
        .reading-title {
            font-size: 2.5rem;
            color: #D4AF37;
            margin-bottom: 30px;
            text-align: center;
        }
        .reading-image {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none; /* JS ile resim varsa açılacak */
        }
        .reading-content {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #E2E8F0;
            text-align: justify;
        }
        @media (max-width: 768px) {
            .reading-container { padding: 30px 20px; }
            .reading-title { font-size: 1.8rem; }
            .reading-content { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <div class="page-loader"><div class="vip-spinner"><div class="ring outer-ring"></div><div class="ring inner-ring"></div><div class="dot"></div></div></div>

    <header class="top-bar">
        <h2 style="color: #3B82F6; letter-spacing: 2px;">KLİNİK OKUMA MODU</h2>
    </header>

    <main class="container">
        <a href="javascript:history.back()" class="back-button">← Seçim Ekranına Dön</a>

        <article class="reading-container" id="okumaAlani">
            <h1 class="reading-title" id="konuBasligi">İçerik Yükleniyor...</h1>
            
            <div class="reading-content" id="konuMetni">
                Lütfen bekleyin, VIP sunuculardan veriler çekiliyor...
            </div>
        </article>
    </main>

    <script type="module" src="js/normal-okuma.js"></script>
</body>
</html>
