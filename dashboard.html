<body>

        <input type="text" class="search-input" placeholder="İçerik, ders veya görsel ara...">

            <a href="kutuphane/ders-notlari.html" class="premium-card" style="border-bottom: 3px solid #3B82F6;">
                <span style="font-size: 2rem; margin-bottom: 10px; display: block;">📚</span>
                Kütüphane
            </a>
            
            <a href="#" class="premium-card" style="border-bottom: 3px solid #EF4444;">
                <span style="font-size: 2rem; margin-bottom: 10px; display: block;">🏥</span>

        </div>

    <script>
        // Sayfa yüklendiğinde çalışacak kusursuz geçiş efekti
        window.addEventListener("load", () => {
            const loader = document.querySelector(".page-loader");
            loader.classList.add("loader-hidden");
            // Animasyon bitince DOM'dan temizleyelim ki arkada tıklamaları engellemesin
            loader.addEventListener("transitionend", () => {
                loader.remove();
            });
        });
    </script>
    <script type="module" src="js/arama-motoru.js"></script>
